name: Doxygen dokumentacija

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Instaliraj Doxygen
        run: sudo apt-get install -y doxygen graphviz

      - name: Generiraj Lab1 dokumentaciju
        run: cd Lab1 && doxygen Doxyfile

      - name: Generiraj PuffRacer dokumentaciju
        run: cd PuffRacer && doxygen Doxyfile

      - name: Spoji dokumentaciju
        run: |
          mkdir -p combined_docs
          cp -r Lab1/docs/html combined_docs/Lab1
          cp -r PuffRacer/docs/doxygen/html combined_docs/PuffRacer
          cat > combined_docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>RUS Dokumentacija</title></head>
          <body>
          <h1>RUS -- Bosnjak dokumentacija</h1>
          <ul>
            <li><a href="Lab1/index.html">Lab1 - Višestruki prekidi ESP32</a></li>
            <li><a href="PuffRacer/index.html">PuffRacer - Spirometar F1</a></li>
          </ul>
          </body>
          </html>
          EOF

      - name: Objavi na GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./combined_docs
